<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raster Label</title><meta name="description" content="Raster Label: Prints the show's labels.">
<link rel="icon" href="/assets/icon-32.png"><link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400&display=swap">
<style>
:root { --ground:#0f1115; --surface:#171a21; --line:#262b36; --ink:#e6e8eb; --ink2:#b7bcc6; --muted:#8b909c; --accent:#70fb3a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); }
body { font: 400 17px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; padding: 16px 0; }
header > a { display: flex; align-items: center; min-height: 44px; }
header .lock { height: 30px; display: block; }
header nav { display: flex; gap: 20px; font: 600 16px/1 "Barlow Condensed", sans-serif; letter-spacing: .03em; }
header nav a { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; color: var(--ink2); }
header nav a[aria-current] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--c, var(--accent)); }
h1 { font: 800 clamp(34px, 6vw, 56px)/1.05 "Barlow Condensed", sans-serif; margin: 48px 0 12px; letter-spacing: .01em; }
.status { display: inline-block; font: 500 13px/1 "IBM Plex Mono", monospace; letter-spacing: .04em; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; }
.cta { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; margin: 24px 12px 0 0; border-radius: 8px;
  font: 700 17px/1 "Barlow Condensed", sans-serif; letter-spacing: .03em; text-decoration: none;
  color: var(--accent); background: rgba(112,251,58,.14); border: 1px solid rgba(112,251,58,.4); }
/* home */
.lede { color: var(--ink2); margin: 0; font-size: 19px; }
.apps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin: 40px 0 64px; }
.app { display: flex; gap: 18px; align-items: center; padding: 22px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface); text-decoration: none; min-height: 120px; }
.app:hover, .app:focus-visible { border-color: var(--c); }
.app img { width: 72px; height: 72px; flex: none; }
.app b { display: block; font: 800 24px/1.1 "Barlow Condensed", sans-serif; color: var(--c); }
.app span { display: block; color: var(--ink2); margin: 4px 0 8px; }
.app em { font: 500 12px/1 "IBM Plex Mono", monospace; font-style: normal; color: var(--muted); letter-spacing: .04em; }
/* app page */
.hero { display: flex; gap: 28px; align-items: center; }
.hero img { width: 112px; height: 112px; flex: none; }
.shots { display: grid; gap: 28px; margin: 48px 0 72px; }
figure { margin: 0; }
figure img { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--line); }
figure.narrow img { max-width: 380px; }
figcaption { font: 600 18px/1.2 "Barlow Condensed", sans-serif; color: var(--ink2); margin-top: 10px; letter-spacing: .02em; }
footer { border-top: 1px solid var(--line); padding: 24px 0 40px; display: flex; flex-wrap: wrap; gap: 8px 24px;
  font-size: 14px; color: var(--muted); }
footer a { color: var(--muted); padding: 12px 0; }
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .apps { grid-template-columns: 1fr; }
  header nav { gap: 14px; font-size: 15px; }
  .hero { flex-direction: column; align-items: flex-start; gap: 16px; }
  .hero img { width: 80px; height: 80px; }
  h1 { margin-top: 24px; }
}
</style></head><body>
